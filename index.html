<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>学习小桌</title>
  <meta name="description" content="四年级日练、初一日练，和词族小桌。打印的练习和英语词族，从学习小桌走进去。">
  <link rel="canonical" href="https://ben8804.github.io/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#f4f1e6">
  <link rel="preload" href="fonts/chillax-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/chillax-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <a class="skip press" href="#desks">跳到三张小桌</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="#top">学习小桌</a>
      <nav class="nav" aria-label="三张小桌">
        <a class="press" href="https://ben8804.github.io/daily-drills/" aria-label="四年级日练">四年级</a>
        <a class="press" href="https://ben8804.github.io/daily-drills/junior1/" aria-label="初一日练">初一</a>
        <a class="press" href="https://ben8804.github.io/daily-drills/word-roots/" aria-label="词族小桌">词族</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="meadow" aria-label="学习小桌">
      <div class="hill hill-a" aria-hidden="true"></div>
      <div class="hill hill-b" aria-hidden="true"></div>
      <div class="soil">
        <div class="wrap layout">
          <div class="intro-copy">
            <div class="intro-top">
              <h1>学习小桌</h1>
              <p class="sticker" aria-hidden="true">选<br>一张</p>
            </div>
            <p class="lede">四年级、初一，每天有日练，可以<mark>打印</mark>。词族小桌记英语词族，在浏览器里玩。</p>
          </div>
          <div class="desk-grid" id="desks" tabindex="-1">
            <article class="desk desk-grade4">
              <div class="desk-head">
                <p class="chip">每天一张</p>
                <a class="quiet" href="https://ben8804.github.io/daily-drills/history.html">往期<span class="sr">，四年级日练</span></a>
              </div>
              <h2>四年级日练</h2>
              <p class="desk-copy">语文、数学、英语，每天一张。<span class="keep">打印出来做</span>，做完再对答案。</p>
              <a class="press btn--primary" href="https://ben8804.github.io/daily-drills/">进去做<span class="sr">，四年级日练</span></a>
            </article>
            <article class="desk desk-junior">
              <div class="desk-head">
                <p class="chip">每天一张</p>
                <a class="quiet" href="https://ben8804.github.io/daily-drills/junior1/history.html">往期<span class="sr">，初一日练</span></a>
              </div>
              <h2>初一日练</h2>
              <p class="desk-copy">初中一年级，每天一张。<span class="keep">打印出来做</span>，<span class="keep">当天</span>的练习都在那一页。</p>
              <a class="press btn--primary" href="https://ben8804.github.io/daily-drills/junior1/">进去做<span class="sr">，初一日练</span></a>
            </article>
            <article class="desk desk-roots">
              <div class="desk-head">
                <p class="chip">拼着玩</p>
              </div>
              <h2>词族小桌</h2>
              <p class="desk-copy">人教版四年级英语词族。把小词拼在<span class="keep">一起</span>，记住这一组。</p>
              <a class="press btn--primary" href="https://ben8804.github.io/daily-drills/word-roots/">进去拼<span class="sr">，词族小桌</span></a>
            </article>
          </div>
          <div class="hero-stage">
            <div class="sheet">
              <div class="sheet-shadow" aria-hidden="true">
                <span class="sheet-fringe"></span>
                <span class="sheet-shape"></span>
              </div>
              <div class="sheet-body">
                <p class="note-kicker">给今天</p>
                <p class="note-text">先做一张日练。还有时间，再去<span class="keep">拼词</span>。<span class="keep">往期都留着</span>，做不完也<span class="keep">没关系</span>。</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="ground" aria-hidden="true"></div>
      <div class="kraft-line" aria-hidden="true"></div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>给家长和孩子的一张小桌子。</p>
    </div>
  </footer>
</body>
</html>
